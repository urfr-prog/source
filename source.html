<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>ADAM Grid — v2 · 3×6 · Flip XY</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--cell:min(80px,20vw);--gap:8px;--grid-w:calc(var(--cell)*3 + var(--gap)*2)}
html,body{height:100%;overflow:hidden;touch-action:none}
body{background:#12131a;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;user-select:none;color:rgba(180,180,190,0.5)}
#c{width:var(--grid-w);height:calc(var(--cell)*6 + var(--gap)*5);touch-action:none;cursor:default;border-radius:4px}
.top-bar{position:fixed;top:env(safe-area-inset-top,8px);left:0;right:0;display:flex;flex-direction:column;align-items:center;gap:4px;z-index:10}
.logo{display:flex;align-items:center;gap:4px;height:36px;cursor:pointer}
.logo-icon{width:32px;height:32px}
.logo-icon svg{width:100%;height:100%}
.logo-icon svg path,.logo-icon svg line,.logo-icon svg rect,.logo-icon svg polygon{stroke:rgba(240,240,250,0.9);stroke-width:2;stroke-linecap:round;stroke-linejoin:round;fill:none;filter:drop-shadow(0 0 8px rgba(240,240,250,0.4))}
.nav-row{display:flex;gap:6px;align-items:center}
.nav-dot{width:8px;height:8px;border-radius:50%;background:rgba(180,180,190,0.2);transition:all 0.3s;cursor:pointer}
.nav-dot.active{background:rgba(126,200,227,0.7);box-shadow:0 0 8px rgba(126,200,227,0.4)}
.nav-label{font-size:0.65rem;color:rgba(126,200,227,0.4);letter-spacing:0.15em}
.ctrl-row{display:flex;gap:8px}
.dbtn{background:transparent;border:1px solid rgba(180,180,190,0.25);color:rgba(180,180,190,0.5);padding:6px 12px;border-radius:8px;cursor:pointer;font-size:0.7rem;font-family:inherit;letter-spacing:0.05em}
.dbtn:hover{border-color:rgba(180,180,190,0.5);color:rgba(180,180,190,0.8)}
.floating-pts{position:fixed;pointer-events:none;font-size:1.2rem;font-weight:bold;color:#ffd700;text-shadow:0 0 10px rgba(255,215,0,0.8);animation:floatUp 1s ease-out forwards;z-index:1000}
@keyframes floatUp{0%{opacity:1;transform:translateY(0) scale(1)}100%{opacity:0;transform:translateY(-60px) scale(1.3)}}
</style>
</head>
<body>
<div class="top-bar">
 <div class="logo" id="logo">
  <div class="logo-icon"><svg viewBox="0 0 36 36"><path d="M8 26L18 10L28 26"/></svg></div>
  <div class="logo-icon"><svg viewBox="0 0 36 36"><polygon points="10,10 26,18 10,26"/></svg></div>
  <div class="logo-icon"><svg viewBox="0 0 36 36"><path d="M8 26L18 10L28 26"/></svg></div>
  <div class="logo-icon"><svg viewBox="0 0 36 36"><line x1="10" y1="8" x2="10" y2="28"/><line x1="18" y1="8" x2="18" y2="28"/><line x1="26" y1="8" x2="26" y2="28"/></svg></div>
 </div>
 <div class="nav-row">
  <span class="nav-label" id="navLabel">T1</span>

 </div>
 <div class="ctrl-row">
  <button class="dbtn" id="btnUndo">Undo</button>
  <button class="dbtn" id="btnReset">Reset</button>

</div>
<canvas id="c"></canvas>
<!-- score masqué mais éléments conservés pour le JS -->
<div style="display:none"><span id="scoreVal">0</span><span id="comboVal">×1</span><span id="bestVal">0</span></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
const COLS=3,ROWS=6,TOTAL=18,PORTE_POSITIONS=[7],NUM_FACES=2;
const isPorte=i=>PORTE_POSITIONS.includes(i);
const STATE_ORDER=['white','silver','gold','emerald','cosmic','supernovae'];
const STATE_MULT={white:1,silver:2,gold:3,emerald:5,cosmic:10,supernovae:20};
const PTS={simple:100,twin:1000};
const GAP=1.08,HALF=0.52,SAT_DEPTH=0.06,SAT_LIFT=0.08;
const FACE_ROT=[0,Math.PI/2];
const CAM_Z_MIN=4,CAM_Z_MAX=20;
const BANK=['chevron','circle','twoCircles','line','threeLines','twoPoints','square','wave'];
const SEEDS=[12345,67890];
const ICO={
 chevron:{f1:'M20 32L45 12L70 32',f2:'M20 12L45 32L70 12',t:'path'},
 circle:{f1:'45,22,12',f2:'45,22,12',t:'circle'},
 twoCircles:{f1:'30,22,8|60,22,8',f2:'30,22,8|60,22,8',t:'circles'},
 line:{f1:'15,22,75,22',f2:'15,22,75,22',t:'line'},
 threeLines:{f1:'25,10,25,34|45,10,45,34|65,10,65,34',f2:'25,10,25,34|45,10,45,34|65,10,65,34',t:'lines'},
 twoPoints:{f1:'30,22,4|60,22,4',f2:'30,22,4|60,22,4',t:'points'},
 square:{f1:'25,10,40,24,3',f2:'25,10,40,24,3',t:'rect'},
 wave:{f1:'M10 22Q28 6 45 22Q62 38 80 22',f2:'M10 22Q28 6 45 22Q62 38 80 22',t:'path'}
};
function renderIcoSVG(name,f2){
 const d=ICO[name];if(!d)return'';const data=f2?d.f2:d.f1;
 if(d.t==='path')return`<path class="i" d="${data}"/>`;
 if(d.t==='circle'){const[cx,cy,r]=data.split(',');return`<circle class="i" cx="${cx}" cy="${cy}" r="${r}"/>`;}
 if(d.t==='line'){const[x1,y1,x2,y2]=data.split(',');return`<line class="i" x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}"/>`;}
 if(d.t==='rect'){const[x,y,w,h,rx]=data.split(',');return`<rect class="i" x="${x}" y="${y}" width="${w}" height="${h}" rx="${rx}"/>`;}
 return data.split('|').map(p=>{const v=p.split(',');
  if(d.t==='circles')return`<circle class="i" cx="${v[0]}" cy="${v[1]}" r="${v[2]}"/>`;
  if(d.t==='points')return`<circle class="p" cx="${v[0]}" cy="${v[1]}" r="${v[2]}"/>`;
  return`<line class="i" x1="${v[0]}" y1="${v[1]}" x2="${v[2]}" y2="${v[3]}"/>`;
 }).join('');
}
const STC={
 white:{border:'rgba(180,180,190,0.35)',icon:'rgba(180,180,190,0.35)',pt:'rgba(180,180,190,0.35)',sep:'rgba(180,180,190,0.3)',flt:'',bw:1},
 silver:{border:'rgba(6,182,212,0.6)',icon:'#22d3ee',pt:'#22d3ee',sep:'rgba(34,211,238,0.4)',flt:'drop-shadow(0 0 2px rgba(34,211,238,0.4))',bw:1},
 gold:{border:'rgba(255,215,0,0.7)',icon:'#ffd700',pt:'#ffd700',sep:'rgba(255,215,0,0.4)',flt:'drop-shadow(0 0 4px rgba(255,215,0,0.6))',bw:1},
 emerald:{border:'rgba(52,211,153,0.9)',icon:'#34d399',pt:'#34d399',sep:'rgba(52,211,153,0.6)',flt:'drop-shadow(0 0 6px rgba(52,211,153,0.9))',bw:1},
 cosmic:{border:'rgba(131,56,236,0.7)',icon:'#c4b5fd',pt:'#c4b5fd',sep:'rgba(196,181,253,0.6)',flt:'drop-shadow(0 0 6px rgba(131,56,236,0.7))',bw:2},
 supernovae:{border:'rgba(255,140,0,0.7)',icon:'#ffeb3b',pt:'#ffeb3b',sep:'rgba(255,235,59,0.6)',flt:'drop-shadow(0 0 6px rgba(255,215,0,0.7))',bw:3},
 ice:{border:'rgba(220,235,248,0.45)',icon:'rgba(220,235,248,0.7)',pt:'rgba(220,235,248,0.7)',sep:'rgba(220,235,248,0.25)',flt:'drop-shadow(0 0 4px rgba(220,235,248,0.4))',bw:1}
};
// SVG → CanvasTexture
const _tc={};
function getDominoTex(f1,f2,rot,state){
 const k=f1+'|'+f2+'|'+rot+'|'+state;if(_tc[k])return _tc[k];
 const c=STC[state]||STC.white,r=((rot||0)%360+360)%360;
 const top=renderIcoSVG(f1,false),bot=renderIcoSVG(f2,true);
 const svg=`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 90 90">
  <style>.i{stroke:${c.icon};stroke-width:2;stroke-linecap:round;stroke-linejoin:round;fill:none;${c.flt?'filter:'+c.flt:''}}.p{fill:${c.pt};${c.flt?'filter:'+c.flt:''}}.s{stroke:${c.sep};stroke-width:1}</style>
  <g transform="rotate(${r},45,45)"><line class="s" x1="0" y1="45" x2="90" y2="45"/><g>${top}</g><g transform="translate(0,45)">${bot}</g></g></svg>`;
 const S=256,cv=document.createElement('canvas');cv.width=S;cv.height=S;
 const ctx=cv.getContext('2d');
 const tex=new THREE.CanvasTexture(cv);tex.needsUpdate=false;
 const blob=new Blob([svg],{type:'image/svg+xml;charset=utf-8'});
 const url=URL.createObjectURL(blob);
 const img=new Image();
 img.onload=()=>{
  const m=4,rd=36;
  ctx.fillStyle='rgba(18,19,26,0.95)';
  ctx.beginPath();ctx.moveTo(m+rd,m);ctx.lineTo(S-m-rd,m);ctx.quadraticCurveTo(S-m,m,S-m,m+rd);ctx.lineTo(S-m,S-m-rd);ctx.quadraticCurveTo(S-m,S-m,S-m-rd,S-m);ctx.lineTo(m+rd,S-m);ctx.quadraticCurveTo(m,S-m,m,S-m-rd);ctx.lineTo(m,m+rd);ctx.quadraticCurveTo(m,m,m+rd,m);ctx.closePath();ctx.fill();
  ctx.strokeStyle=c.border;ctx.lineWidth=c.bw;
  ctx.beginPath();ctx.moveTo(m+rd,m);ctx.lineTo(S-m-rd,m);ctx.quadraticCurveTo(S-m,m,S-m,m+rd);ctx.lineTo(S-m,S-m-rd);ctx.quadraticCurveTo(S-m,S-m,S-m-rd,S-m);ctx.lineTo(m+rd,S-m);ctx.quadraticCurveTo(m,S-m,m,S-m-rd);ctx.lineTo(m,m+rd);ctx.quadraticCurveTo(m,m,m+rd,m);ctx.closePath();ctx.stroke();
  ctx.drawImage(img,m+2,m+2,S-m*2-4,S-m*2-4);
  tex.needsUpdate=true;URL.revokeObjectURL(url);
 };
 img.src=url;_tc[k]=tex;return tex;
}
// ══ JEU ══
let allDom=[[],[]],allHist=[[],[]],allScoreHist=[[],[]];
let score=0,bestScore=0,comboCount=0,lastFusionTime=0;
let fusionCounts={silver:0,gold:0,emerald:0,cosmic:0,supernovae:0};
function srand(seed){let s=seed;return()=>{s=(s*1103515245+12345)&0x7fffffff;return s/0x7fffffff;};}
function initFace(fi){const rng=srand(SEEDS[fi]);allDom[fi]=Array.from({length:TOTAL},(_,i)=>{if(isPorte(i))return null;const x=i%COLS,y=Math.floor(i/COLS);return{face1:BANK[Math.floor(rng()*BANK.length)],face2:BANK[Math.floor(rng()*BANK.length)],rotation:((x+y)%2===0)?0:90,state:'white'};});allHist[fi]=[];allScoreHist[fi]=[];}
// Getter: lit la case (les portes sont dans allDom comme les autres)
function getDom(fi,i){return allDom[fi]?allDom[fi][i]:null;}
// Setter: écrit la case. Si position-porte, propage à tous les layers (liaison)
function setDom(fi,i,v){
 if(isPorte(i)){
  for(let f=0;f<NUM_FACES;f++)allDom[f][i]=v?{...v}:null;
  updCubeTexFromPorte();
 }else{
  allDom[fi][i]=v;
 }
}
function getPos(i){return{x:i%COLS,y:Math.floor(i/COLS)};}
function getIdx(x,y){return(x<0||x>=COLS||y<0||y>=ROWS)?-1:y*COLS+x;}
function getExposed(dm,dir){if(!dm)return null;const r=((dm.rotation%360)+360)%360;const m={0:{top:'face1',bottom:'face2'},90:{left:'face2',right:'face1'},180:{top:'face2',bottom:'face1'},270:{left:'face1',right:'face2'}};return m[r]?.[dir]?dm[m[r][dir]]:null;}
function getRemaining(dm,ed){if(!dm)return null;const r=((dm.rotation%360)+360)%360;const m={0:{top:'face2',bottom:'face1'},90:{right:'face2',left:'face1'},180:{top:'face1',bottom:'face2'},270:{right:'face1',left:'face2'}};return m[r]?.[ed]?dm[m[r][ed]]:null;}
function areTwins(a,b){if(!a||!b)return false;const r1=((a.rotation%360)+360)%360,r2=((b.rotation%360)+360)%360;if(r1===r2&&a.face1===b.face1&&a.face2===b.face2)return true;if(Math.abs(r1-r2)===180&&a.face1===b.face2&&a.face2===b.face1)return true;return false;}
// ══ THREE ══
const canvas=document.getElementById('c');
const renderer=new THREE.WebGLRenderer({canvas,antialias:true});renderer.setClearColor(0x12131a);
const scene=new THREE.Scene();const camera=new THREE.PerspectiveCamera(50,1,0.1,100);
scene.add(new THREE.AmbientLight(0xffffff,0.8));
function resize(){const c=canvas;const w=c.clientWidth,h=c.clientHeight;renderer.setSize(w,h);renderer.setPixelRatio(Math.min(window.devicePixelRatio,2));camera.aspect=w/h;camera.updateProjectionMatrix();}
resize();window.addEventListener('resize',resize);
const cubeGroup=new THREE.Group();scene.add(cubeGroup);
// Porte cube
const pMats=[];for(let i=0;i<6;i++)pMats.push(new THREE.MeshBasicMaterial({transparent:true}));
const pMesh=new THREE.Mesh(new THREE.BoxGeometry(1,1,1),pMats);pMesh.userData.isCube=true;cubeGroup.add(pMesh);
function updCubeTexFromPorte(){
 // Affiche le domino-porte principal (index 7) sur le cube central
 // Comme les portes sont synchronisées, on lit depuis allDom[0]
 const PORTE_DISPLAY=PORTE_POSITIONS[0];
 const p=allDom[0]?allDom[0][PORTE_DISPLAY]:null;
 const st=p?p.state:'white';
 const t=p?getDominoTex(p.face1,p.face2,p.rotation,st):null;
 pMats.forEach(m=>{m.map=t;m.opacity=p?1:0;m.needsUpdate=true;});
}
updCubeTexFromPorte();
// Halo
const hcv=document.createElement('canvas');hcv.width=256;hcv.height=256;const hx=hcv.getContext('2d');
const hg=hx.createRadialGradient(128,128,0,128,128,128);
hg.addColorStop(0,'rgba(220,235,248,0.25)');hg.addColorStop(0.3,'rgba(200,220,240,0.12)');hg.addColorStop(0.6,'rgba(180,210,235,0.04)');hg.addColorStop(1,'rgba(180,210,235,0)');
hx.fillStyle=hg;hx.fillRect(0,0,256,256);
const haloMat=new THREE.SpriteMaterial({map:new THREE.CanvasTexture(hcv),transparent:true,opacity:0.7,depthWrite:false});
const haloSpr=new THREE.Sprite(haloMat);haloSpr.scale.set(2.5,2.5,1);cubeGroup.add(haloSpr);
// Sat mesh
function rrS(w,h,r){const s=new THREE.Shape(),hw=w/2,hh=h/2;s.moveTo(-hw+r,-hh);s.lineTo(hw-r,-hh);s.quadraticCurveTo(hw,-hh,hw,-hh+r);s.lineTo(hw,hh-r);s.quadraticCurveTo(hw,hh,hw-r,hh);s.lineTo(-hw+r,hh);s.quadraticCurveTo(-hw,hh,-hw,hh-r);s.lineTo(-hw,-hh+r);s.quadraticCurveTo(-hw,-hh,-hw+r,-hh);return s;}
function mkSat(){
 const g=new THREE.Group(),SZ=1,R=0.15;
 const n=new THREE.Mesh(new THREE.PlaneGeometry(SZ,SZ),new THREE.MeshBasicMaterial({transparent:true,side:THREE.DoubleSide}));n.position.z=SAT_DEPTH/2+0.001;g.add(n);
 const bg=new THREE.ExtrudeGeometry(rrS(SZ,SZ,R),{depth:SAT_DEPTH,bevelEnabled:false});bg.translate(0,0,-SAT_DEPTH/2);
 g.add(new THREE.Mesh(bg,[new THREE.MeshBasicMaterial({color:0x0e0f18,transparent:true,opacity:0.3}),new THREE.MeshBasicMaterial({color:0x141520,transparent:true,opacity:0.45})]));
 const el=new THREE.LineSegments(new THREE.EdgesGeometry(bg,15),new THREE.LineBasicMaterial({color:0xb4b4be,transparent:true,opacity:0.15}));g.add(el);
 const sc=document.createElement('canvas');sc.width=128;sc.height=128;const sx=sc.getContext('2d');const sg=sx.createRadialGradient(64,64,10,64,64,60);sg.addColorStop(0,'rgba(0,0,0,0.3)');sg.addColorStop(0.5,'rgba(0,0,0,0.1)');sg.addColorStop(1,'rgba(0,0,0,0)');sx.fillStyle=sg;sx.fillRect(0,0,128,128);
 const sm=new THREE.Mesh(new THREE.PlaneGeometry(SZ*1.2,SZ*1.2),new THREE.MeshBasicMaterial({map:new THREE.CanvasTexture(sc),transparent:true,opacity:0.45,depthWrite:false}));sm.position.z=-SAT_DEPTH/2-SAT_LIFT+0.005;g.add(sm);
 const gl=new THREE.Mesh(new THREE.ShapeGeometry(rrS(SZ+0.06,SZ+0.06,R+0.03)),new THREE.MeshBasicMaterial({color:0x7ec8e3,transparent:true,opacity:0}));gl.position.z=-SAT_DEPTH/2-0.005;g.add(gl);
 // Ring pour bordure arc-en-ciel (cosmic/supernovae)
 const rCv=document.createElement('canvas');rCv.width=256;rCv.height=256;
 const rTex=new THREE.CanvasTexture(rCv);
 const rMesh=new THREE.Mesh(new THREE.PlaneGeometry(SZ,SZ),new THREE.MeshBasicMaterial({map:rTex,transparent:true,opacity:0,depthWrite:false,side:THREE.DoubleSide}));
 rMesh.position.z=SAT_DEPTH/2+0.003;g.add(rMesh);
 // Glow sprite pour halo large
 const gCv=document.createElement('canvas');gCv.width=128;gCv.height=128;
 const gTex=new THREE.CanvasTexture(gCv);
 const gSpr=new THREE.Sprite(new THREE.SpriteMaterial({map:gTex,transparent:true,opacity:0,depthWrite:false}));
 gSpr.scale.set(SZ*1.6,SZ*1.6,1);g.add(gSpr);
 g.userData={numMesh:n,edgeLines:el,glowMesh:gl,ringCanvas:rCv,ringTex:rTex,ringMesh:rMesh,haloCanvas:gCv,haloTex:gTex,haloSprite:gSpr,isSat:true};return g;
}
const sats=[];
function g2l(gx,gy){return{x:(gx-1)*GAP,y:-(gy-2.5)*GAP};}
function placeSat(s,q){s.mesh.position.copy(new THREE.Vector3(s.lx,s.ly,HALF+SAT_LIFT).applyQuaternion(q));s.mesh.quaternion.copy(q);s.baseQuat=q.clone();}
function faceQuat(faceRotIdx){return new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(0,1,0),FACE_ROT[faceRotIdx]);}
function buildSats(){sats.forEach(s=>cubeGroup.remove(s.mesh));sats.length=0;for(let fi=0;fi<NUM_FACES;fi++){for(let i=0;i<TOTAL;i++){if(isPorte(i)&&fi!==0)continue;const dm=getDom(fi,i);if(!dm)continue;const{x,y}=getPos(i);const p=g2l(x,y);const m=mkSat();m.visible=false;cubeGroup.add(m);sats.push({gi:i,tab:fi,lx:p.x,ly:p.y,mesh:m,baseQuat:null});}}}
function rebuildFace(fi){const old=sats.filter(s=>s.tab===fi&&(!isPorte(s.gi)||fi===0));old.forEach(s=>{cubeGroup.remove(s.mesh);sats.splice(sats.indexOf(s),1);});for(let i=0;i<TOTAL;i++){if(isPorte(i)&&fi!==0)continue;const dm=getDom(fi,i);if(!dm)continue;const{x,y}=getPos(i);const p=g2l(x,y);const m=mkSat();m.visible=false;cubeGroup.add(m);sats.push({gi:i,tab:fi,lx:p.x,ly:p.y,mesh:m,baseQuat:null});}}
function updSatTex(s){const d=getDom(s.tab,s.gi);if(!d){s.mesh.visible=false;return;}const t=getDominoTex(d.face1,d.face2,d.rotation,d.state||'white');s.mesh.userData.numMesh.material.map=t;s.mesh.userData.numMesh.material.needsUpdate=true;const st=d.state||'white';const col=st==='cosmic'?0x8338ec:st==='supernovae'?0xff8c00:st==='emerald'?0x34d399:st==='gold'?0xffd700:st==='silver'?0x06b6d4:0xb4b4be;s.mesh.userData.edgeLines.material.color.set(col);s.mesh.userData.edgeLines.material.opacity=st==='white'?0.12:0.3;}
// ══ NAV ══
let currentIdx=0,isNav=false,busy=false,navDir=0,navAxis='y',targetQuat=new THREE.Quaternion(),targetCamX=0,targetCamZ=11;
function mod(n){return((n%NUM_FACES)+NUM_FACES)%NUM_FACES;}
function assignFaces(){
 const qFront=new THREE.Quaternion();
 const qRight=new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(0,1,0),Math.PI/2);
 const qTop=new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(1,0,0),-Math.PI/2);
 const ci=mod(currentIdx),ni=mod(currentIdx+1);
 sats.forEach(s=>{
  if(isPorte(s.gi)){placeSat(s,qFront);s.mesh.visible=!!getDom(0,s.gi);if(s.mesh.parent!==cubeGroup)cubeGroup.attach(s.mesh);return;}
  if(s.tab===ci){placeSat(s,qFront);if(s.mesh.parent!==cubeGroup)cubeGroup.attach(s.mesh);}
  else if(s.tab===ni){placeSat(s,qRight);if(s.mesh.parent!==cubeGroup)cubeGroup.attach(s.mesh);}
 });
}
function refreshZoom(){
 const gridH=(ROWS-1)*GAP+1;
 const vFov=camera.fov*Math.PI/180;
 targetCamZ=gridH/2/Math.tan(vFov/2)+1.2;
 targetCamX=0;
}
function navRight(){if(busy||isNav)return;busy=true;isNav=true;navDir=1;navAxis='y';targetQuat.setFromAxisAngle(new THREE.Vector3(0,1,0),-Math.PI/2);sats.forEach(s=>{if(s.tab===mod(currentIdx)||s.tab===mod(currentIdx+1))s.mesh.visible=true;});}
function navLeft(){if(busy||isNav)return;busy=true;isNav=true;navDir=-1;navAxis='y';targetQuat.setFromAxisAngle(new THREE.Vector3(0,1,0),Math.PI/2);sats.forEach(s=>{if(s.tab===mod(currentIdx)||s.tab===mod(currentIdx-1))s.mesh.visible=true;});}
function navUp(){if(busy||isNav)return;busy=true;isNav=true;navDir=1;navAxis='x';
 const qTop=new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(1,0,0),-Math.PI/2);
 const ni=mod(currentIdx+1);

  else if(Math.abs(dy)>Math.abs(dx)*1.5&&Math.abs(dy)>40){if(dy<0)navUp();else navDown();}
  else{const dir=detectDiag(dx,dy);if(dir){let gx,gy;if(pSat){const p=getPos(pSat.gi);gx=p.x;gy=p.y;}else if(pCb){gx=1;gy=2;}if(gx!==undefined){const group=getGroup(gx,gy,dir);if(group){const fi=mod(currentIdx);if(group.some(i=>getDom(fi,i)))execGroupRot(group,isCW(dir));}}}}}
 pS=null;pSat=null;pCb=false;});
canvas.addEventListener('pointercancel',()=>{pS=null;pSat=null;pCb=false;});
document.addEventListener('keydown',e=>{if(e.key==='ArrowRight'){navRight();e.preventDefault();}else if(e.key==='ArrowLeft'){navLeft();e.preventDefault();}else if(e.key==='ArrowUp'){navUp();e.preventDefault();}else if(e.key==='ArrowDown'){navDown();e.preventDefault();}});

// ══ UI ══
const dotsEl=document.getElementById('navDots');
for(let i=0;i<NUM_FACES;i++){const d=document.createElement('div');d.className='nav-dot'+(i===0?' active':'');d.addEventListener('click',()=>{if(!isNav&&!busy){if(i===1&&mod(currentIdx)===0)navRight();else if(i===0&&mod(currentIdx)===1)navLeft();}});dotsEl.appendChild(d);}
function updateUI(){const idx=mod(currentIdx);document.getElementById('navLabel').textContent=`T${idx+1}`;dotsEl.querySelectorAll('.nav-dot').forEach((d,i)=>d.classList.toggle('active',i===idx));}
function updateScore(){document.getElementById('scoreVal').textContent=score.toLocaleString();const ce=document.getElementById('comboVal');ce.textContent=comboCount>1?`×${(1+(comboCount-1)*0.5).toFixed(1)}`:'×1';ce.style.opacity=comboCount>1?'1':'0.5';}
document.getElementById('btnReset').addEventListener('click',()=>{const fi=mod(currentIdx);initFace(fi);const newPorte={face1:BANK[Math.floor(srand(SEEDS[fi]+7)()*BANK.length)],face2:BANK[Math.floor(srand(SEEDS[fi]+77)()*BANK.length)],rotation:0,state:'white'};PORTE_POSITIONS.forEach(pi=>setDom(fi,pi,newPorte));score=0;comboCount=0;lastFusionTime=0;fusionCounts={silver:0,gold:0,emerald:0,cosmic:0,supernovae:0};rebuildFace(fi);assignFaces();updCubeTexFromPorte();refreshZoom();updateUI();updateScore();});
document.getElementById('btnUndo').addEventListener('click',()=>undo());
// ══ COSMIC DRAWING ══
function drawCosmicRing(cv,angle){
 const S=cv.width,ctx=cv.getContext('2d');
 ctx.clearRect(0,0,S,S);
 const cx=S/2,cy=S/2;
 const grad=ctx.createConicGradient(angle,cx,cy);
 const cols=['#ff006e','#8338ec','#06b6d4','#34d399','#ffd700','#ff006e'];
 cols.forEach((c,i)=>grad.addColorStop(i/(cols.length-1),c));
 const lw=5,m=4,rd=36;
 ctx.strokeStyle=grad;ctx.lineWidth=lw;
 ctx.beginPath();ctx.moveTo(m+rd,m);ctx.lineTo(S-m-rd,m);ctx.quadraticCurveTo(S-m,m,S-m,m+rd);ctx.lineTo(S-m,S-m-rd);ctx.quadraticCurveTo(S-m,S-m,S-m-rd,S-m);ctx.lineTo(m+rd,S-m);ctx.quadraticCurveTo(m,S-m,m,S-m-rd);ctx.lineTo(m,m+rd);ctx.quadraticCurveTo(m,m,m+rd,m);ctx.closePath();ctx.stroke();
}
function drawSupernovaeRing(cv,angle){
 const S=cv.width,ctx=cv.getContext('2d');
 ctx.clearRect(0,0,S,S);
 const cx=S/2,cy=S/2;
 const grad=ctx.createConicGradient(angle,cx,cy);
 ['#ff4500','#ff8c00','#ffd700','#ffff00','#ff8c00','#ff4500'].forEach((c,i)=>grad.addColorStop(i/5,c));
 const lw=6,m=4,rd=36;
 ctx.strokeStyle=grad;ctx.lineWidth=lw;
 ctx.beginPath();ctx.moveTo(m+rd,m);ctx.lineTo(S-m-rd,m);ctx.quadraticCurveTo(S-m,m,S-m,m+rd);ctx.lineTo(S-m,S-m-rd);ctx.quadraticCurveTo(S-m,S-m,S-m-rd,S-m);ctx.lineTo(m+rd,S-m);ctx.quadraticCurveTo(m,S-m,m,S-m-rd);ctx.lineTo(m,m+rd);ctx.quadraticCurveTo(m,m,m+rd,m);ctx.closePath();ctx.stroke();
}
function drawHalo(cv,r,g,b,phase,intensity){
 const S=cv.width,cx=S/2,ctx=cv.getContext('2d');
 ctx.clearRect(0,0,S,S);
 const pulse=0.5+0.5*Math.sin(phase);
 const a=intensity*(0.6+pulse*0.4);
 const grd=ctx.createRadialGradient(cx,cx,S*0.15,cx,cx,cx);
 grd.addColorStop(0,`rgba(${r},${g},${b},${(a*0.6).toFixed(2)})`);
 grd.addColorStop(0.4,`rgba(${r},${g},${b},${(a*0.3).toFixed(2)})`);
 grd.addColorStop(0.7,`rgba(${r},${g},${b},${(a*0.1).toFixed(2)})`);
 grd.addColorStop(1,`rgba(${r},${g},${b},0)`);
 ctx.fillStyle=grd;ctx.fillRect(0,0,S,S);
}
// ══ RENDER ══
const clock=new THREE.Clock();let lt=0;
function animate(){
 requestAnimationFrame(animate);const t=clock.getElapsedTime(),dt=t-lt;lt=t;
 updateRotAnim(dt);
 if(isNav&&navDir!==0){cubeGroup.quaternion.slerp(targetQuat,0.12);if(1-Math.abs(cubeGroup.quaternion.dot(targetQuat))<0.0001){cubeGroup.quaternion.copy(targetQuat);onNavDone();}}
 haloMat.opacity=0.4+0.35*(0.5+0.5*Math.sin(t*1.8));
 camera.position.x+=(targetCamX-camera.position.x)*0.08;camera.position.z+=(targetCamZ-camera.position.z)*0.08;camera.lookAt(camera.position.x,0,0);
 const fi=mod(currentIdx);
 sats.forEach((s,si)=>{if(!isNav){if(isPorte(s.gi))s.mesh.visible=!!getDom(0,s.gi);else s.mesh.visible=(s.tab===fi);}if(s.mesh.visible){updSatTex(s);const isRotating=rotAnimActive&&rotAnimActive.sat===s;if(s.baseQuat&&!isNav&&!isRotating){const ph=t*1.2+si*1.7;const bq=new THREE.Quaternion().setFromEuler(new THREE.Euler(Math.sin(ph)*0.012,0,Math.cos(ph*0.7)*0.008));s.mesh.quaternion.copy(s.baseQuat).multiply(bq);}
  const d=getDom(s.tab,s.gi);if(!d)return;const st=d.state||'white',ud=s.mesh.userData;
  if(st==='cosmic'){
   drawCosmicRing(ud.ringCanvas,t*Math.PI/2);ud.ringTex.needsUpdate=true;ud.ringMesh.material.opacity=1;
   drawHalo(ud.haloCanvas,131,56,236,t*Math.PI,0.5);ud.haloTex.needsUpdate=true;ud.haloSprite.material.opacity=0.8;
   const cp=t*1.5+si;ud.edgeLines.material.color.setRGB(0.5+Math.sin(cp)*0.3,Math.sin(cp+2.1)*0.3+0.2,0.5+Math.sin(cp+4.2)*0.3);ud.edgeLines.material.opacity=0.5+Math.sin(t*2)*0.15;
   ud.glowMesh.material.color.set(0x8338ec);ud.glowMesh.material.opacity=0.2+0.12*Math.sin(t*2+si);
  }
  else if(st==='supernovae'){
   drawSupernovaeRing(ud.ringCanvas,t*Math.PI*2/3);ud.ringTex.needsUpdate=true;ud.ringMesh.material.opacity=1;
   drawHalo(ud.haloCanvas,255,140,0,t*Math.PI*1.25,0.6);ud.haloTex.needsUpdate=true;ud.haloSprite.material.opacity=0.9;
   ud.edgeLines.material.color.setRGB(1,0.4+Math.sin(t*2+si)*0.3,Math.sin(t*1.5)*0.15);ud.edgeLines.material.opacity=0.5+Math.sin(t*2.5)*0.12;
   ud.glowMesh.material.color.set(0xff8c00);ud.glowMesh.material.opacity=0.3+0.2*Math.sin(t*2.5+si);
  }
  else if(st==='emerald'){
   ud.ringMesh.material.opacity=0;
   drawHalo(ud.haloCanvas,52,211,153,t*Math.PI*0.8,0.35);ud.haloTex.needsUpdate=true;ud.haloSprite.material.opacity=0.7;
   ud.edgeLines.material.color.set(0x34d399);ud.edgeLines.material.opacity=0.3+0.1*Math.sin(t*1.5+si);
   ud.glowMesh.material.color.set(0x34d399);ud.glowMesh.material.opacity=0.15+0.1*Math.sin(t*1.5+si);
  }
  else if(st==='gold'){
   ud.ringMesh.material.opacity=0;
   drawHalo(ud.haloCanvas,255,215,0,t*Math.PI*0.6,0.25);ud.haloTex.needsUpdate=true;ud.haloSprite.material.opacity=0.5;
   ud.edgeLines.material.color.set(0xffd700);ud.edgeLines.material.opacity=0.25+0.08*Math.sin(t*1.2+si);
   ud.glowMesh.material.color.set(0xffd700);ud.glowMesh.material.opacity=0.08+0.05*Math.sin(t*1.2+si);
  }
  else if(st==='silver'){
   ud.ringMesh.material.opacity=0;
   drawHalo(ud.haloCanvas,6,182,212,t*Math.PI*0.5,0.2);ud.haloTex.needsUpdate=true;ud.haloSprite.material.opacity=0.4;
   ud.edgeLines.material.color.set(0x22d3ee);ud.edgeLines.material.opacity=0.2+0.06*Math.sin(t+si);
   ud.glowMesh.material.color.set(0x06b6d4);ud.glowMesh.material.opacity=0.05+0.03*Math.sin(t+si);
  }
  else{ud.glowMesh.material.opacity=0;ud.ringMesh.material.opacity=0;ud.haloSprite.material.opacity=0;ud.edgeLines.material.color.set(0xb4b4be);ud.edgeLines.material.opacity=0.12;}}});
 renderer.render(scene,camera);
}
for(let f=0;f<NUM_FACES;f++)initFace(f);
// Initialisation des portes — générées avec le seed du face 0, propagées sur tous les layers
(function(){
 PORTE_POSITIONS.forEach((pi,k)=>{
  const f1=BANK[Math.floor(srand(SEEDS[0]+7+k*100)()*BANK.length)];
  const f2=BANK[Math.floor(srand(SEEDS[0]+77+k*100)()*BANK.length)];
  const porteDm={face1:f1,face2:f2,rotation:0,state:'white'};
  for(let f=0;f<NUM_FACES;f++)allDom[f][pi]={...porteDm};
 });
})();
buildSats();assignFaces();updCubeTexFromPorte();refreshZoom();camera.position.set(0,0,targetCamZ);updateUI();updateScore();animate();
</script>
