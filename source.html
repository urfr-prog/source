<script>
const COLS=3,ROWS=5,TOTAL=15,NUM_FACES=4;
const STATE_ORDER=['white','silver','gold','emerald','cosmic','supernovae'];
const GAP=1.08,HALF=0.52,SAT_DEPTH=0.06,SAT_LIFT=0.08;
const FACE_ROT=[0,Math.PI/2,Math.PI,-Math.PI/2];
const CAM_Z_MIN=4,CAM_Z_MAX=20;
const BANK=['chevron','circle','twoCircles','line','threeLines','twoPoints','square','wave'];
const ICO={
 chevron:{f1:'M20 32L45 12L70 32',f2:'M20 12L45 32L70 12',t:'path'},
 circle:{f1:'45,22,12',f2:'45,22,12',t:'circle'},
 twoCircles:{f1:'30,22,8|60,22,8',f2:'30,22,8|60,22,8',t:'circles'},
 line:{f1:'15,22,75,22',f2:'15,22,75,22',t:'line'},
 threeLines:{f1:'25,10,25,34|45,10,45,34|65,10,65,34',f2:'25,10,25,34|45,10,45,34|65,10,65,34',t:'lines'},
 twoPoints:{f1:'30,22,4|60,22,4',f2:'30,22,4|60,22,4',t:'points'},
 square:{f1:'25,10,40,24,3',f2:'25,10,40,24,3',t:'rect'},
 wave:{f1:'M10 22Q28 6 45 22Q62 38 80 22',f2:'M10 22Q28 6 45 22Q62 38 80 22',t:'path'}
};
function renderIcoSVG(name,f2){
 const d=ICO[name];if(!d)return'';const data=f2?d.f2:d.f1;
 if(d.t==='path')return`<path class="i" d="${data}"/>`;
 if(d.t==='circle'){const[cx,cy,r]=data.split(',');return`<circle class="i" cx="${cx}" cy="${cy}" r="${r}"/>`;}
 if(d.t==='line'){const[x1,y1,x2,y2]=data.split(',');return`<line class="i" x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}"/>`;}
 if(d.t==='rect'){const[x,y,w,h,rx]=data.split(',');return`<rect class="i" x="${x}" y="${y}" width="${w}" height="${h}" rx="${rx}"/>`;}
 return data.split('|').map(p=>{const v=p.split(',');
  if(d.t==='circles')return`<circle class="i" cx="${v[0]}" cy="${v[1]}" r="${v[2]}"/>`;
  if(d.t==='points')return`<circle class="p" cx="${v[0]}" cy="${v[1]}" r="${v[2]}"/>`;
  return`<line class="i" x1="${v[0]}" y1="${v[1]}" x2="${v[2]}" y2="${v[3]}"/>`;
 }).join('');
}
const STC={
 white:{border:'rgba(180,180,190,0.35)',icon:'rgba(180,180,190,0.35)',pt:'rgba(180,180,190,0.35)',sep:'rgba(180,180,190,0.3)',flt:'',bw:1},
 silver:{border:'rgba(6,182,212,0.6)',icon:'#22d3ee',pt:'#22d3ee',sep:'rgba(34,211,238,0.4)',flt:'drop-shadow(0 0 2px rgba(34,211,238,0.4))',bw:1},
 gold:{border:'rgba(255,215,0,0.7)',icon:'#ffd700',pt:'#ffd700',sep:'rgba(255,215,0,0.4)',flt:'drop-shadow(0 0 4px rgba(255,215,0,0.6))',bw:1},
 emerald:{border:'rgba(52,211,153,0.9)',icon:'#34d399',pt:'#34d399',sep:'rgba(52,211,153,0.6)',flt:'drop-shadow(0 0 6px rgba(52,211,153,0.9))',bw:1},
 cosmic:{border:'rgba(131,56,236,0.7)',icon:'#c4b5fd',pt:'#c4b5fd',sep:'rgba(196,181,253,0.6)',flt:'drop-shadow(0 0 6px rgba(131,56,236,0.7))',bw:2},
 supernovae:{border:'rgba(255,140,0,0.7)',icon:'#ffeb3b',pt:'#ffeb3b',sep:'rgba(255,235,59,0.6)',flt:'drop-shadow(0 0 6px rgba(255,215,0,0.7))',bw:3}
};
const _tc={};
function getDominoTex(f1,f2,rot,state){
 const k=f1+'|'+f2+'|'+rot+'|'+state;if(_tc[k])return _tc[k];
 const c=STC[state]||STC.white,r=((rot||0)%360+360)%360;
 const top=renderIcoSVG(f1,false),bot=renderIcoSVG(f2,true);
 const svg=`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 90 90">
  <style>.i{stroke:${c.icon};stroke-width:2;stroke-linecap:round;stroke-linejoin:round;fill:none;${c.flt?'filter:'+c.flt:''}}.p{fill:${c.pt};${c.flt?'filter:'+c.flt:''}}.s{stroke:${c.sep};stroke-width:1}</style>
  <g transform="rotate(${r},45,45)"><line class="s" x1="0" y1="45" x2="90" y2="45"/><g>${top}</g><g transform="translate(0,45)">${bot}</g></g></svg>`;
 const S=256,cv=document.createElement('canvas');cv.width=S;cv.height=S;
 const ctx=cv.getContext('2d');
 const tex=new THREE.CanvasTexture(cv);tex.needsUpdate=false;
 const blob=new Blob([svg],{type:'image/svg+xml;charset=utf-8'});
 const url=URL.createObjectURL(blob);
 const img=new Image();
 img.onload=()=>{
  const m=4,rd=36;
  ctx.fillStyle='rgba(18,19,26,0.95)';
  ctx.beginPath();ctx.moveTo(m+rd,m);ctx.lineTo(S-m-rd,m);ctx.quadraticCurveTo(S-m,m,S-m,m+rd);ctx.lineTo(S-m,S-m-rd);ctx.quadraticCurveTo(S-m,S-m,S-m-rd,S-m);ctx.lineTo(m+rd,S-m);ctx.quadraticCurveTo(m,S-m,m,S-m-rd);ctx.lineTo(m,m+rd);ctx.quadraticCurveTo(m,m,m+rd,m);ctx.closePath();ctx.fill();
  ctx.strokeStyle=c.border;ctx.lineWidth=c.bw;
  ctx.beginPath();ctx.moveTo(m+rd,m);ctx.lineTo(S-m-rd,m);ctx.quadraticCurveTo(S-m,m,S-m,m+rd);ctx.lineTo(S-m,S-m-rd);ctx.quadraticCurveTo(S-m,S-m,S-m-rd,S-m);ctx.lineTo(m+rd,S-m);ctx.quadraticCurveTo(m,S-m,m,S-m-rd);ctx.lineTo(m,m+rd);ctx.quadraticCurveTo(m,m,m+rd,m);ctx.closePath();ctx.stroke();
  ctx.drawImage(img,m+2,m+2,S-m*2-4,S-m*2-4);
  tex.needsUpdate=true;URL.revokeObjectURL(url);
 };
 img.src=url;_tc[k]=tex;return tex;
}
// ══ JEU ══
let allDom=[[],[],[],[]],allHist=[];
// Référence : le tableau 0 (T1) est la cible
// Les 4 tableaux ont les mêmes 15 dominos mais mélangés et avec des rotations différentes
function srand(seed){let s=seed;return()=>{s=(s*1103515245+12345)&0x7fffffff;return s/0x7fffffff;};}

// Générer les 15 dominos de référence (partagés par les 4 tableaux)
const REF_SEED=42;
const REF_DOMINOS=[];
(function(){
 const rng=srand(REF_SEED);
 for(let i=0;i<TOTAL;i++){
  REF_DOMINOS.push({
   face1:BANK[Math.floor(rng()*BANK.length)],
   face2:BANK[Math.floor(rng()*BANK.length)],
   rotation:0,
   state:'white'
  });
 }
})();

// Fisher-Yates shuffle avec seed
function shuffleArray(arr,rng){
 const a=[...arr];
 for(let i=a.length-1;i>0;i--){
  const j=Math.floor(rng()*((i+1)|0));
  [a[i],a[j]]=[a[j],a[i]];
 }
 return a;
}

const FACE_SEEDS=[11111,22222,33333,44444];

function initAllFaces(){
 // T1 = référence (ordre original, rotation 0)
 allDom[0]=REF_DOMINOS.map(d=>({...d}));
 // T2, T3, T4 = mêmes dominos, ordre mélangé, rotations aléatoires
 // Garantir qu'aucune position ne matche entre aucune paire de faces
 let seedOffset=0;
 let valid=false;
 while(!valid){
  for(let fi=1;fi<NUM_FACES;fi++){
   const rng=srand(FACE_SEEDS[fi]+seedOffset);
   const indices=shuffleArray(Array.from({length:TOTAL},(_,i)=>i),rng);
   allDom[fi]=new Array(TOTAL);
   for(let i=0;i<TOTAL;i++){
    const srcDom=REF_DOMINOS[indices[i]];
    const rotSteps=Math.floor(rng()*4);
    allDom[fi][i]={
     face1:srcDom.face1,
     face2:srcDom.face2,
     rotation:(rotSteps*90)%360,
     state:'white'
    };
   }
  }
  // Vérifier : aucune position ne doit matcher entre 2 faces quelconques
  valid=true;
  for(let i=0;i<TOTAL&&valid;i++){
   for(let fa=0;fa<NUM_FACES&&valid;fa++){
    for(let fb=fa+1;fb<NUM_FACES&&valid;fb++){
     if(domMatch(allDom[fa][i],allDom[fb][i]))valid=false;
    }
   }
  }
  if(!valid)seedOffset++;
 }
}

function getDom(fi,i){return allDom[fi]?allDom[fi][i]:null;}
function setDom(fi,i,v){allDom[fi][i]=v;}
function getPos(i){return{x:i%COLS,y:Math.floor(i/COLS)};}
function getIdx(x,y){return(x<0||x>=COLS||y<0||y>=ROWS)?-1:y*COLS+x;}

// Comparer deux dominos : même identité + même rotation
function domMatch(a,b){
 if(!a||!b)return false;
 return a.face1===b.face1&&a.face2===b.face2&&((a.rotation%360+360)%360)===((b.rotation%360+360)%360);
}

// Locks : pour chaque position, quelles faces sont verrouillées entre elles
// locked[i] = Set de face indices qui sont alignées
let locked=Array.from({length:TOTAL},()=>new Set());

function checkMatches(){
 let count=0;
 for(let i=0;i<TOTAL;i++){
  let allMatch=true;
  const d0=allDom[0][i];
  if(!d0){allMatch=false;}
  else{for(let f=1;f<NUM_FACES;f++){if(!domMatch(d0,allDom[f][i])){allMatch=false;break;}}}
  if(allMatch)count++;
 }
 return count;
}

// Déterminer les groupes de faces qui matchent, verrouiller, assigner les états
function updateStates(){
 for(let i=0;i<TOTAL;i++){
  // Trouver le plus grand groupe de faces identiques à cette position
  // On cherche quelles faces sont identiques entre elles
  const groups=[];// groups of face indices with same domino+rot
  const used=new Set();
  for(let f=0;f<NUM_FACES;f++){
   if(used.has(f))continue;
   const df=allDom[f][i];
   if(!df){used.add(f);continue;}
   const grp=[f];used.add(f);
   for(let g=f+1;g<NUM_FACES;g++){
    if(used.has(g))continue;
    if(domMatch(df,allDom[g][i])){grp.push(g);used.add(g);}
   }
   groups.push(grp);
  }
  // Le plus grand groupe détermine le lock
  let bestGrp=[];
  groups.forEach(g=>{if(g.length>bestGrp.length)bestGrp=g;});
  
  // Mettre à jour les locks
  if(bestGrp.length>=2){
   locked[i]=new Set(bestGrp);
  }else{
   locked[i]=new Set();
  }
  
  // Assigner l'état basé sur la taille du groupe
  // 1 = white, 2 = silver (locked 2), 3 = gold (locked 3), 4 = cosmic (locked 4)
  const stateMap={1:'white',2:'silver',3:'gold',4:'cosmic'};
  const matchState=stateMap[bestGrp.length]||'white';
  
  // Appliquer l'état aux faces du groupe, white aux autres
  for(let f=0;f<NUM_FACES;f++){
   if(allDom[f][i]){
    allDom[f][i].state=bestGrp.includes(f)?matchState:'white';
   }
  }
 }
}

// Vérifier si un domino est verrouillé sur une face donnée
function isLocked(fi,gi){
 return locked[gi]&&locked[gi].has(fi);
}

// ══ THREE ══
const canvas=document.getElementById('c');
const renderer=new THREE.WebGLRenderer({canvas,antialias:true});renderer.setClearColor(0x12131a);
const scene=new THREE.Scene();const camera=new THREE.PerspectiveCamera(50,1,0.1,100);
scene.add(new THREE.AmbientLight(0xffffff,0.8));
function resize(){const c=canvas;const w=c.clientWidth,h=c.clientHeight;renderer.setSize(w,h);renderer.setPixelRatio(Math.min(window.devicePixelRatio,2));camera.aspect=w/h;camera.updateProjectionMatrix();}
resize();window.addEventListener('resize',resize);
const cubeGroup=new THREE.Group();scene.add(cubeGroup);

// Cube central décoratif (petit, sans porte)
const cubeMat=new THREE.MeshBasicMaterial({color:0x1a1b26,transparent:true,opacity:0.3});
const cubeMesh=new THREE.Mesh(new THREE.BoxGeometry(0.5,0.5,0.5),cubeMat);
cubeMesh.userData.isCube=true;cubeGroup.add(cubeMesh);

// Halo
const hcv=document.createElement('canvas');hcv.width=256;hcv.height=256;const hx=hcv.getContext('2d');
const hg=hx.createRadialGradient(128,128,0,128,128,128);
hg.addColorStop(0,'rgba(220,235,248,0.25)');hg.addColorStop(0.3,'rgba(200,220,240,0.12)');hg.addColorStop(0.6,'rgba(180,210,235,0.04)');hg.addColorStop(1,'rgba(180,210,235,0)');
hx.fillStyle=hg;hx.fillRect(0,0,256,256);
const haloMat=new THREE.SpriteMaterial({map:new THREE.CanvasTexture(hcv),transparent:true,opacity:0.7,depthWrite:false});
const haloSpr=new THREE.Sprite(haloMat);haloSpr.scale.set(2,2,1);cubeGroup.add(haloSpr);

// Sat mesh
function rrS(w,h,r){const s=new THREE.Shape(),hw=w/2,hh=h/2;s.moveTo(-hw+r,-hh);s.lineTo(hw-r,-hh);s.quadraticCurveTo(hw,-hh,hw,-hh+r);s.lineTo(hw,hh-r);s.quadraticCurveTo(hw,hh,hw-r,hh);s.lineTo(-hw+r,hh);s.quadraticCurveTo(-hw,hh,-hw,hh-r);s.lineTo(-hw,-hh+r);s.quadraticCurveTo(-hw,-hh,-hw+r,-hh);return s;}
function mkSat(){
 const g=new THREE.Group(),SZ=1,R=0.15;
 const n=new THREE.Mesh(new THREE.PlaneGeometry(SZ,SZ),new THREE.MeshBasicMaterial({transparent:true,side:THREE.DoubleSide}));n.position.z=SAT_DEPTH/2+0.001;g.add(n);
 const bg=new THREE.ExtrudeGeometry(rrS(SZ,SZ,R),{depth:SAT_DEPTH,bevelEnabled:false});bg.translate(0,0,-SAT_DEPTH/2);
 g.add(new THREE.Mesh(bg,[new THREE.MeshBasicMaterial({color:0x0e0f18,transparent:true,opacity:0.3}),new THREE.MeshBasicMaterial({color:0x141520,transparent:true,opacity:0.45})]));
 const el=new THREE.LineSegments(new THREE.EdgesGeometry(bg,15),new THREE.LineBasicMaterial({color:0xb4b4be,transparent:true,opacity:0.15}));g.add(el);
 const sc=document.createElement('canvas');sc.width=128;sc.height=128;const sx=sc.getContext('2d');const sg=sx.createRadialGradient(64,64,10,64,64,60);sg.addColorStop(0,'rgba(0,0,0,0.3)');sg.addColorStop(0.5,'rgba(0,0,0,0.1)');sg.addColorStop(1,'rgba(0,0,0,0)');sx.fillStyle=sg;sx.fillRect(0,0,128,128);
 const sm=new THREE.Mesh(new THREE.PlaneGeometry(SZ*1.2,SZ*1.2),new THREE.MeshBasicMaterial({map:new THREE.CanvasTexture(sc),transparent:true,opacity:0.45,depthWrite:false}));sm.position.z=-SAT_DEPTH/2-SAT_LIFT+0.005;g.add(sm);
 const gl=new THREE.Mesh(new THREE.ShapeGeometry(rrS(SZ+0.06,SZ+0.06,R+0.03)),new THREE.MeshBasicMaterial({color:0x7ec8e3,transparent:true,opacity:0}));gl.position.z=-SAT_DEPTH/2-0.005;g.add(gl);
 // Ring pour bordure (cosmic/supernovae)
 const rCv=document.createElement('canvas');rCv.width=256;rCv.height=256;
 const rTex=new THREE.CanvasTexture(rCv);
 const rMesh=new THREE.Mesh(new THREE.PlaneGeometry(SZ,SZ),new THREE.MeshBasicMaterial({map:rTex,transparent:true,opacity:0,depthWrite:false,side:THREE.DoubleSide}));
 rMesh.position.z=SAT_DEPTH/2+0.003;g.add(rMesh);
 const gCv=document.createElement('canvas');gCv.width=128;gCv.height=128;
 const gTex=new THREE.CanvasTexture(gCv);
 const gSpr=new THREE.Sprite(new THREE.SpriteMaterial({map:gTex,transparent:true,opacity:0,depthWrite:false}));
 gSpr.scale.set(SZ*1.6,SZ*1.6,1);g.add(gSpr);
 g.userData={numMesh:n,edgeLines:el,glowMesh:gl,ringCanvas:rCv,ringTex:rTex,ringMesh:rMesh,haloCanvas:gCv,haloTex:gTex,haloSprite:gSpr,isSat:true};return g;
}
const sats=[];
function g2l(gx,gy){return{x:(gx-1)*GAP,y:-(gy-2)*GAP};}
function placeSat(s,fry){const q=new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(0,1,0),fry);s.mesh.position.copy(new THREE.Vector3(s.lx,s.ly,HALF+SAT_LIFT).applyQuaternion(q));s.mesh.quaternion.copy(q);s.baseQuat=q.clone();}
function buildSats(){sats.forEach(s=>cubeGroup.remove(s.mesh));sats.length=0;for(let fi=0;fi<NUM_FACES;fi++){for(let i=0;i<TOTAL;i++){const dm=getDom(fi,i);if(!dm)continue;const{x,y}=getPos(i);const p=g2l(x,y);const m=mkSat();m.visible=false;cubeGroup.add(m);sats.push({gi:i,tab:fi,lx:p.x,ly:p.y,mesh:m,baseQuat:null});}}}
function rebuildFace(fi){const old=sats.filter(s=>s.tab===fi);old.forEach(s=>{cubeGroup.remove(s.mesh);sats.splice(sats.indexOf(s),1);});for(let i=0;i<TOTAL;i++){const dm=getDom(fi,i);if(!dm)continue;const{x,y}=getPos(i);const p=g2l(x,y);const m=mkSat();m.visible=false;cubeGroup.add(m);sats.push({gi:i,tab:fi,lx:p.x,ly:p.y,mesh:m,baseQuat:null});}}
function updSatTex(s){const d=getDom(s.tab,s.gi);if(!d){s.mesh.visible=false;return;}const t=getDominoTex(d.face1,d.face2,d.rotation,d.state||'white');s.mesh.userData.numMesh.material.map=t;s.mesh.userData.numMesh.material.needsUpdate=true;const st=d.state||'white';const col=st==='cosmic'?0x8338ec:st==='supernovae'?0xff8c00:st==='emerald'?0x34d399:st==='gold'?0xffd700:st==='silver'?0x06b6d4:0xb4b4be;s.mesh.userData.edgeLines.material.color.set(col);s.mesh.userData.edgeLines.material.opacity=st==='white'?0.12:0.3;}
// ══ NAV ══
let currentIdx=0,isNav=false,busy=false,navDir=0,targetQuat=new THREE.Quaternion(),targetCamX=0,targetCamZ=11;
function mod(n){return((n%NUM_FACES)+NUM_FACES)%NUM_FACES;}
function assignFaces(){const fm=[[mod(currentIdx),0],[mod(currentIdx+1),1],[mod(currentIdx-1),3]];sats.forEach(s=>{const e=fm.find(f=>f[0]===s.tab);if(e){placeSat(s,FACE_ROT[e[1]]);if(s.mesh.parent!==cubeGroup)cubeGroup.attach(s.mesh);}});}
function refreshZoom(){
 const gridH=(ROWS-1)*GAP+1;
 const vFov=camera.fov*Math.PI/180;
 targetCamZ=gridH/2/Math.tan(vFov/2)+1.2;
 targetCamX=0;
}
function navRight(){if(busy||isNav)return;busy=true;isNav=true;navDir=1;targetQuat.setFromAxisAngle(new THREE.Vector3(0,1,0),-Math.PI/2);sats.forEach(s=>{if(s.tab===mod(currentIdx)||s.tab===mod(currentIdx+1))s.mesh.visible=true;});}
function navLeft(){if(busy||isNav)return;busy=true;isNav=true;navDir=-1;targetQuat.setFromAxisAngle(new THREE.Vector3(0,1,0),Math.PI/2);sats.forEach(s=>{if(s.tab===mod(currentIdx)||s.tab===mod(currentIdx-1))s.mesh.visible=true;});}
function onNavDone(){currentIdx=mod(currentIdx+navDir);cubeGroup.quaternion.identity();targetQuat.identity();navDir=0;assignFaces();isNav=false;busy=false;refreshZoom();updateUI();}
// ══ GAME ══
let gameAnim=false;
function saveState(){allHist.push(JSON.parse(JSON.stringify(allDom)));if(allHist.length>30)allHist.shift();}
function undo(){if(!allHist.length||gameAnim||isNav)return;allDom=allHist.pop();locked=Array.from({length:TOTAL},()=>new Set());updateStates();for(let f=0;f<NUM_FACES;f++)rebuildFace(f);assignFaces();refreshZoom();updateUI();updateMatchInfo();}

// Rotation animée
let rotAnimActive=null;
function rotateDom(gi){
 if(gameAnim||isNav||rotAnimActive)return;
 const fi=mod(currentIdx),dm=getDom(fi,gi);if(!dm)return;
 // Bloqué si verrouillé sur cette face
 if(isLocked(fi,gi))return;
 const sat=sats.find(s=>s.tab===fi&&s.gi===gi);
 if(!sat||!sat.baseQuat)return;
 saveState();gameAnim=true;
 const localRot=new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(0,0,1),-Math.PI/2);
 const startQ=sat.baseQuat.clone();
 const endQ=sat.baseQuat.clone().multiply(localRot);
 rotAnimActive={sat,startQ,endQ,elapsed:0,dur:250,gi,fi};
}
function updateRotAnim(dt){
 if(!rotAnimActive)return;
 rotAnimActive.elapsed+=dt*1000;
 const p=Math.min(rotAnimActive.elapsed/rotAnimActive.dur,1),e=easeOutCubic(p);
 rotAnimActive.sat.mesh.quaternion.copy(rotAnimActive.startQ).slerp(rotAnimActive.endQ,e);
 if(p>=1){
  const gi=rotAnimActive.gi,fi=rotAnimActive.fi;
  const dm=getDom(fi,gi);
  if(dm)dm.rotation=(dm.rotation+90)%360;
  rotAnimActive.sat.mesh.quaternion.copy(rotAnimActive.sat.baseQuat);
  updSatTex(rotAnimActive.sat);
  rotAnimActive=null;
  gameAnim=false;
  updateStates();
  // Rebuild toutes les faces pour refléter les nouveaux états
  for(let f=0;f<NUM_FACES;f++)rebuildFace(f);
  assignFaces();updateMatchInfo();
 }
}
function detectDiag(dx,dy){const ax=Math.abs(dx),ay=Math.abs(dy);if(ax<15||ay<15||ax/ay<0.5||ax/ay>2)return null;return dy<0?(dx>0?'ur':'ul'):(dx>0?'dr':'dl');}
function getGroup(x,y,dir){const off={ur:[0,-1],ul:[-1,-1],dr:[0,0],dl:[-1,0]};const[ox,oy]=off[dir],tx=x+ox,ty=y+oy;if(tx<0||tx>COLS-2||ty<0||ty>ROWS-2)return null;return[getIdx(tx,ty),getIdx(tx+1,ty),getIdx(tx,ty+1),getIdx(tx+1,ty+1)];}
function isCW(dir){return dir==='ur'||dir==='dr';}
function easeOutCubic(t){return 1-Math.pow(1-t,3);}
function easeInOutQuad(t){return t<0.5?2*t*t:1-Math.pow(-2*t+2,2)/2;}

function execGroupRot(group,cw){
 if(gameAnim||isNav)return;
 const fi=mod(currentIdx);
 saveState();gameAnim=true;
 const map=cw?[2,0,3,1]:[1,3,0,2];
 
 // Collecter quelles faces doivent être affectées par la propagation
 // Pour chaque domino du groupe qui est locked, propager le même swap sur les faces liées
 const affectedFaces=new Set([fi]);
 for(const gi of group){
  if(isLocked(fi,gi)){
   locked[gi].forEach(f=>affectedFaces.add(f));
  }
 }
 
 // Sauvegarder et appliquer le swap sur TOUTES les faces affectées
 const allSaved={};
 affectedFaces.forEach(f=>{
  allSaved[f]=group.map(i=>getDom(f,i)?{...getDom(f,i)}:null);
 });
 
 // Animation seulement sur la face courante
 const movers=[];
 for(let i=0;i<4;i++){
  const srcIdx=group[i],dstIdx=group[map[i]];
  const sat=sats.find(s=>s.tab===fi&&s.gi===srcIdx);
  if(!sat)continue;
  const tp=getPos(dstIdx),tl=g2l(tp.x,tp.y);
  const tgtPos=new THREE.Vector3(tl.x,tl.y,HALF+SAT_LIFT);
  movers.push({sat,mesh:sat.mesh,srcIdx,dstIdx,startPos:sat.mesh.position.clone(),endPos:tgtPos});
 }
 const dur=500;let elapsed=0;
 const animStep=(now)=>{
  if(!animStep._last)animStep._last=now;
  elapsed+=now-animStep._last;animStep._last=now;
  const p=Math.min(elapsed/dur,1),e=easeOutCubic(p);
  movers.forEach(mv=>{mv.mesh.position.lerpVectors(mv.startPos,mv.endPos,e);});
  if(p<1){requestAnimationFrame(animStep);}
  else{
   // Appliquer le swap sur toutes les faces affectées
   affectedFaces.forEach(f=>{
    const saved=allSaved[f];
    for(let i=0;i<4;i++){setDom(f,group[map[i]],saved[i]);}
   });
   updateStates();
   // Rebuild toutes les faces affectées
   affectedFaces.forEach(f=>rebuildFace(f));
   assignFaces();refreshZoom();updateUI();
   gameAnim=false;
   updateMatchInfo();
  }
 };
 requestAnimationFrame(animStep);
}

function updateMatchInfo(){
 const m=checkMatches();
 document.getElementById('matchInfo').textContent=`${m} / ${TOTAL}`;
 if(m===TOTAL){
  document.getElementById('winOverlay').classList.add('show');
 }
}

// ══ RAYCAST ══
const ray=new THREE.Raycaster(),mv=new THREE.Vector2();
function getSatAt(cx,cy){const r=canvas.getBoundingClientRect();mv.x=((cx-r.left)/r.width)*2-1;mv.y=-((cy-r.top)/r.height)*2+1;ray.setFromCamera(mv,camera);const all=[];const fi=mod(currentIdx);sats.forEach(s=>{if(s.mesh.visible&&s.tab===fi)s.mesh.traverse(c=>{if(c.isMesh)all.push(c);});});for(const h of ray.intersectObjects(all,false)){let o=h.object;while(o){if(o.userData?.isSat){const s=sats.find(x=>x.mesh===o);if(s)return s;}o=o.parent;}}return null;}
// ══ POINTER ══
let pS=null,pM=false,pSat=null;
// Convertir un point écran en coordonnée grille (x,y) la plus proche
function screenToGrid(cx,cy){
 const r=canvas.getBoundingClientRect();
 const ndcX=((cx-r.left)/r.width)*2-1;
 const ndcY=-((cy-r.top)/r.height)*2+1;
 const vec=new THREE.Vector3(ndcX,ndcY,0.5).unproject(camera);
 const dir=vec.sub(camera.position).normalize();
 // Intersection avec le plan Z = HALF+SAT_LIFT
 const t=(HALF+SAT_LIFT-camera.position.z)/dir.z;
 const wx=camera.position.x+dir.x*t;
 const wy=camera.position.y+dir.y*t;
 // Convertir world coords en grille
 const gx=Math.round(wx/GAP+1);
 const gy=Math.round(-wy/GAP+2);
 return{x:Math.max(0,Math.min(COLS-1,gx)),y:Math.max(0,Math.min(ROWS-1,gy))};
}
canvas.addEventListener('pointerdown',e=>{
 if(isNav||gameAnim)return;pS={x:e.clientX,y:e.clientY};pM=false;
 pSat=getSatAt(e.clientX,e.clientY);
 canvas.setPointerCapture(e.pointerId);
});
canvas.addEventListener('pointermove',e=>{if(pS&&Math.hypot(e.clientX-pS.x,e.clientY-pS.y)>12)pM=true;});
canvas.addEventListener('pointerup',e=>{if(!pS)return;const dx=e.clientX-pS.x,dy=e.clientY-pS.y;
 if(!pM){if(pSat)rotateDom(pSat.gi);}
 else if(Math.hypot(dx,dy)>=15){
  // Horizontal swipe = nav
  if(Math.abs(dx)>Math.abs(dy)*1.5&&Math.abs(dx)>40){if(dx<0)navRight();else navLeft();}
  else{
   const dir=detectDiag(dx,dy);
   if(dir){
    // Utiliser le point de départ pour trouver la cellule grille
    const gp=screenToGrid(pS.x,pS.y);
    const group=getGroup(gp.x,gp.y,dir);
    if(group&&group.some(i=>getDom(mod(currentIdx),i))){
     execGroupRot(group,isCW(dir));
    }
   }
  }
 }
 pS=null;pSat=null;});
canvas.addEventListener('pointercancel',()=>{pS=null;pSat=null;});
document.addEventListener('keydown',e=>{if(e.key==='ArrowRight'){navRight();e.preventDefault();}else if(e.key==='ArrowLeft'){navLeft();e.preventDefault();}});

// ══ UI ══
const dotsEl=document.getElementById('navDots');
for(let i=0;i<NUM_FACES;i++){const d=document.createElement('div');d.className='nav-dot'+(i===0?' active':'');d.addEventListener('click',()=>{if(!isNav&&!busy){const diff=i-mod(currentIdx);if(diff>0)navRight();else if(diff<0)navLeft();}});dotsEl.appendChild(d);}
function updateUI(){const idx=mod(currentIdx);document.getElementById('navLabel').textContent=`T${idx+1}`;dotsEl.querySelectorAll('.nav-dot').forEach((d,i)=>d.classList.toggle('active',i===idx));}
document.getElementById('btnReset').addEventListener('click',()=>{initAllFaces();locked=Array.from({length:TOTAL},()=>new Set());updateStates();allHist=[];for(let f=0;f<NUM_FACES;f++)rebuildFace(f);buildSats();assignFaces();refreshZoom();updateUI();updateMatchInfo();});
document.getElementById('btnUndo').addEventListener('click',()=>undo());

// ══ HALO DRAWING ══
function drawHalo(cv,r,g,b,phase,intensity){
 const S=cv.width,cx=S/2,ctx=cv.getContext('2d');
 ctx.clearRect(0,0,S,S);
 const pulse=0.5+0.5*Math.sin(phase);
 const a=intensity*(0.6+pulse*0.4);
 const grd=ctx.createRadialGradient(cx,cx,S*0.15,cx,cx,cx);
 grd.addColorStop(0,`rgba(${r},${g},${b},${(a*0.6).toFixed(2)})`);
 grd.addColorStop(0.4,`rgba(${r},${g},${b},${(a*0.3).toFixed(2)})`);
 grd.addColorStop(0.7,`rgba(${r},${g},${b},${(a*0.1).toFixed(2)})`);
 grd.addColorStop(1,`rgba(${r},${g},${b},0)`);
 ctx.fillStyle=grd;ctx.fillRect(0,0,S,S);
}
function drawCosmicRing(cv,angle){
 const S=cv.width,ctx=cv.getContext('2d');
 ctx.clearRect(0,0,S,S);
 const cx=S/2,cy=S/2;
 const grad=ctx.createConicGradient(angle,cx,cy);
 const cols=['#ff006e','#8338ec','#06b6d4','#34d399','#ffd700','#ff006e'];
 cols.forEach((c,i)=>grad.addColorStop(i/(cols.length-1),c));
 const lw=5,m=4,rd=36;
 ctx.strokeStyle=grad;ctx.lineWidth=lw;
 ctx.beginPath();ctx.moveTo(m+rd,m);ctx.lineTo(S-m-rd,m);ctx.quadraticCurveTo(S-m,m,S-m,m+rd);ctx.lineTo(S-m,S-m-rd);ctx.quadraticCurveTo(S-m,S-m,S-m-rd,S-m);ctx.lineTo(m+rd,S-m);ctx.quadraticCurveTo(m,S-m,m,S-m-rd);ctx.lineTo(m,m+rd);ctx.quadraticCurveTo(m,m,m+rd,m);ctx.closePath();ctx.stroke();
}

// ══ RENDER ══
const clock=new THREE.Clock();let lt=0;
function animate(){
 requestAnimationFrame(animate);const t=clock.getElapsedTime(),dt=t-lt;lt=t;
 updateRotAnim(dt);
 if(isNav&&navDir!==0){cubeGroup.quaternion.slerp(targetQuat,0.12);if(1-Math.abs(cubeGroup.quaternion.dot(targetQuat))<0.0001){cubeGroup.quaternion.copy(targetQuat);onNavDone();}}
 haloMat.opacity=0.4+0.35*(0.5+0.5*Math.sin(t*1.8));
 camera.position.x+=(targetCamX-camera.position.x)*0.08;camera.position.z+=(targetCamZ-camera.position.z)*0.08;camera.lookAt(camera.position.x,0,0);
 const fi=mod(currentIdx);
 sats.forEach((s,si)=>{
  if(!isNav){s.mesh.visible=(s.tab===fi);}
  if(s.mesh.visible){
   updSatTex(s);
   const isRotating=rotAnimActive&&rotAnimActive.sat===s;
   const domLocked=isLocked(s.tab,s.gi);
   if(s.baseQuat&&!isNav&&!isRotating&&!domLocked){
    const ph=t*1.2+si*1.7;
    const bq=new THREE.Quaternion().setFromEuler(new THREE.Euler(Math.sin(ph)*0.012,0,Math.cos(ph*0.7)*0.008));
    s.mesh.quaternion.copy(s.baseQuat).multiply(bq);
   }else if(domLocked&&s.baseQuat&&!isNav&&!isRotating){
    s.mesh.quaternion.copy(s.baseQuat);
   }
   const d=getDom(s.tab,s.gi);if(!d)return;
   const st=d.state||'white',ud=s.mesh.userData;
   if(st==='cosmic'){
    drawCosmicRing(ud.ringCanvas,t*Math.PI/2);ud.ringTex.needsUpdate=true;ud.ringMesh.material.opacity=1;
    drawHalo(ud.haloCanvas,131,56,236,t*Math.PI,0.5);ud.haloTex.needsUpdate=true;ud.haloSprite.material.opacity=0.8;
    const cp=t*1.5+si;ud.edgeLines.material.color.setRGB(0.5+Math.sin(cp)*0.3,Math.sin(cp+2.1)*0.3+0.2,0.5+Math.sin(cp+4.2)*0.3);ud.edgeLines.material.opacity=0.5+Math.sin(t*2)*0.15;
    ud.glowMesh.material.color.set(0x8338ec);ud.glowMesh.material.opacity=0.2+0.12*Math.sin(t*2+si);
   }
   else if(st==='gold'){
    ud.ringMesh.material.opacity=0;
    drawHalo(ud.haloCanvas,255,215,0,t*Math.PI*0.6,0.25);ud.haloTex.needsUpdate=true;ud.haloSprite.material.opacity=0.5;
    ud.edgeLines.material.color.set(0xffd700);ud.edgeLines.material.opacity=0.25+0.08*Math.sin(t*1.2+si);
    ud.glowMesh.material.color.set(0xffd700);ud.glowMesh.material.opacity=0.08+0.05*Math.sin(t*1.2+si);
   }
   else if(st==='silver'){
    ud.ringMesh.material.opacity=0;
    drawHalo(ud.haloCanvas,6,182,212,t*Math.PI*0.5,0.2);ud.haloTex.needsUpdate=true;ud.haloSprite.material.opacity=0.4;
    ud.edgeLines.material.color.set(0x22d3ee);ud.edgeLines.material.opacity=0.2+0.06*Math.sin(t+si);
    ud.glowMesh.material.color.set(0x06b6d4);ud.glowMesh.material.opacity=0.05+0.03*Math.sin(t+si);
   }
   else{ud.glowMesh.material.opacity=0;ud.ringMesh.material.opacity=0;ud.haloSprite.material.opacity=0;ud.edgeLines.material.color.set(0xb4b4be);ud.edgeLines.material.opacity=0.12;}
  }
 });
 renderer.render(scene,camera);
}
initAllFaces();
updateStates();
buildSats();assignFaces();refreshZoom();camera.position.set(0,0,targetCamZ);updateUI();updateMatchInfo();animate();
</script>
